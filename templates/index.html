<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RobTarget Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      background: white;
      transform-origin: 50% 50%;
      cursor: grab;
    }
    #canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
'use strict';

/* ─── Global state ────────────────────────────────────────────── */
let robotData = { robtargets: [], wobjdata: [], path: [] };
let settings  = { rotation: 0, vKeystone: 0, hKeystone: 0, zoomX: 100, zoomY: 100,
                  calMarks: false, calX: 500, calY: 500,
                  zFilterEnabled: false, zFilter: 20 };

/*
 * view.ox / view.oy = canvas-pixel position of the robot/wobj origin (0, 0).
 * view.scale        = pixels per robot-mm  (= baseScale * zoom/100).
 *
 * Initialised once on the first data update that contains targets.
 * After that only mouse drag changes ox/oy, and only zoom changes scale.
 */
let view      = null;   // { scale, ox, oy }
let baseScale = null;   // scale at zoom=100 %, set when view is first created

/* Remember viewport size so we can adjust ox/oy proportionally on resize. */
let lastW = 0, lastH = 0;

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

/* ─── Settings (written by /settings via localStorage) ───────── */
const SETTINGS_KEY = 'projectorSettings';

function loadSettings() {
  try {
    const s = localStorage.getItem(SETTINGS_KEY);
    if (s) settings = Object.assign(settings, JSON.parse(s));
  } catch (_) {}
  applyTransform();
}

function applyTransform() {
  const { vKeystone, hKeystone } = settings;
  /* Rotation is applied inside draw() so only the coordinate system rotates,
     not the aspect ratio or keystone correction. */
  canvas.style.transform =
    `perspective(1200px) ` +
    `rotateX(${vKeystone}deg) ` +
    `rotateY(${hKeystone}deg)`;
}

function applyZoom() {
  if (view === null || baseScale === null) return;
  view.scaleX = baseScale * (settings.zoomX / 100);
  view.scaleY = baseScale * (settings.zoomY / 100);
  draw();
}

window.addEventListener('storage', e => {
  if (e.key === SETTINGS_KEY) {
    try { settings = JSON.parse(e.newValue); } catch (_) {}
    applyTransform();
    applyZoom();
  }
});

/* ─── Resize ──────────────────────────────────────────────────── */
function resize() {
  const newW = window.innerWidth;
  const newH = window.innerHeight;

  if (view !== null && lastW > 0 && lastH > 0) {
    /* Keep the origin at the same fractional position on screen */
    view.ox = view.ox / lastW * newW;
    view.oy = view.oy / lastH * newH;
  }

  lastW = newW;
  lastH = newH;
  canvas.width  = newW;
  canvas.height = newH;
  draw();
}
window.addEventListener('resize', resize);

/* ─── View initialisation (called once, on first non-empty data) */
function initView(targets) {
  const W = lastW || window.innerWidth;
  const H = lastH || window.innerHeight;

  if (targets.length === 0) {
    /* No targets yet – put origin in the centre, scale = 2 px/mm */
    view = { scaleX: 2, scaleY: 2, ox: W / 2, oy: H / 2 };
    return;
  }

  /* Bounding box: always include origin (0, 0) */
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  for (const t of targets) {
    const p = parseRobtarget(t.value);
    if (!p) continue;
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }

  const pad    = 0.22;
  const rangeX = (maxX - minX) || 200;
  const rangeY = (maxY - minY) || 200;
  const scale100 = Math.min(
    W / (rangeX * (1 + 2 * pad)),
    H / (rangeY * (1 + 2 * pad)),
  );

  baseScale = scale100;

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  view = {
    scaleX: baseScale * (settings.zoomX / 100),
    scaleY: baseScale * (settings.zoomY / 100),
    ox: W / 2 - cx * baseScale,   /* ox/oy based on 100% scale so zoom feels centred */
    oy: H / 2 + cy * baseScale,
  };
}

/* ─── Parse RAPID value strings ───────────────────────────────── */
/**
 * [[x,y,z],[q1,q2,q3,q4],[cf...],[eax...]]
 * ABB quaternion: q1=w, q2=x, q3=y, q4=z
 */
function parseRobtarget(val) {
  try {
    const d = JSON.parse(val);
    return {
      x: d[0][0], y: d[0][1], z: d[0][2],
      qw: d[1][0], qx: d[1][1], qy: d[1][2], qz: d[1][3],
    };
  } catch (_) { return null; }
}

/* ─── Quaternion → 2-D frame axes ─────────────────────────────── */
function quatAxes2D(qw, qx, qy, qz) {
  return {
    xAxis: [1 - 2*(qy*qy + qz*qz),     2*(qx*qy + qw*qz)],
    yAxis: [    2*(qx*qy - qw*qz),  1 - 2*(qx*qx + qz*qz)],
  };
}

/* Robot mm → canvas px */
function toCanvas(rx, ry, v) {
  return { x: v.ox + rx * v.scaleX, y: v.oy - ry * v.scaleY };
}

/* ─── Drawing helpers ─────────────────────────────────────────── */

/**
 * Append a circular arc from (ax,ay) through (bx,by) to (cx,cy) onto the
 * current sub-path.  Falls back to straight line segments when the three
 * points are (nearly) collinear.
 */
function arcThrough(ax, ay, bx, by, cx, cy) {
  const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  if (Math.abs(D) < 0.5) {
    ctx.lineTo(bx, by);
    ctx.lineTo(cx, cy);
    return;
  }
  const aa = ax*ax + ay*ay, bb = bx*bx + by*by, cc = cx*cx + cy*cy;
  const ox = (aa*(by - cy) + bb*(cy - ay) + cc*(ay - by)) / D;
  const oy = (aa*(cx - bx) + bb*(ax - cx) + cc*(bx - ax)) / D;
  const r  = Math.hypot(ax - ox, ay - oy);

  const angA = Math.atan2(ay - oy, ax - ox);
  const angB = Math.atan2(by - oy, bx - ox);
  const angC = Math.atan2(cy - oy, cx - ox);

  const norm = a => ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const sweepToC = norm(angC - angA);
  const sweepToB = norm(angB - angA);
  const anticlockwise = sweepToB > sweepToC;

  ctx.arc(ox, oy, r, angA, angC, anticlockwise);
}

function drawArrow(x0, y0, x1, y1, color, lw) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len;
  const hLen = Math.min(14, len * 0.38);
  const hW   = hLen * 0.42;

  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = color;
  ctx.lineWidth   = lw || 2;
  ctx.lineCap     = 'round';

  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1 - ux * hLen, y1 - uy * hLen);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * hLen - uy * hW, y1 - uy * hLen + ux * hW);
  ctx.lineTo(x1 - ux * hLen + uy * hW, y1 - uy * hLen - ux * hW);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ─── Calibration mark ────────────────────────────────────────── */
/**
 * Draws a crosshair-circle marker at canvas position (px, py).
 * @param {string} label  – text shown next to the mark
 * @param {boolean} onXAxis – true → mark lies on robot X-axis, false → Y-axis
 */
function drawCalMark(px, py, label, onXAxis) {
  const crossR = 13;   /* crosshair arm length px */
  const circR  = 7;    /* inner circle radius px  */

  ctx.save();
  ctx.strokeStyle = '#0055CC';
  ctx.fillStyle   = '#0055CC';
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([4, 3]);

  /* Crosshair arms */
  ctx.beginPath();
  ctx.moveTo(px - crossR, py); ctx.lineTo(px + crossR, py);
  ctx.moveTo(px, py - crossR); ctx.lineTo(px, py + crossR);
  ctx.stroke();

  ctx.setLineDash([]);

  /* Circle */
  ctx.beginPath();
  ctx.arc(px, py, circR, 0, 2 * Math.PI);
  ctx.stroke();

  /* Label */
  ctx.font      = 'bold 11px monospace';
  ctx.fillStyle = '#0055CC';
  /* Place label to avoid overlapping with the axis arrows */
  const offX = onXAxis ?  crossR + 5 : crossR + 5;
  const offY = onXAxis ? -5           : -5;
  ctx.fillText(label, px + offX, py + offY);

  ctx.restore();
}

/* ─── Main render ─────────────────────────────────────────────── */
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, W, H);

  if (!view) return;

  const { scaleX, scaleY } = view;
  const scaleAvg = Math.sqrt(scaleX * scaleY);

  const originAxisPxX = Math.max(55,  Math.min(160, 75  * scaleX));
  const originAxisPxY = Math.max(55,  Math.min(160, 75  * scaleY));
  const targetAxisPxX = Math.max(22,  Math.min(75,  32  * scaleX));
  const targetAxisPxY = Math.max(22,  Math.min(75,  32  * scaleY));
  const dotR          = Math.max(4,   Math.min(12,  5.5 * scaleAvg));
  const fontSize      = Math.round(Math.max(10, Math.min(16, 11.5 * scaleAvg)));

  /* ── Rotate around wobj origin ──────────────────────────────── */
  const org    = toCanvas(0, 0, view);
  const rotRad = settings.rotation * Math.PI / 180;

  ctx.save();
  ctx.translate(org.x, org.y);
  ctx.rotate(rotRad);
  ctx.translate(-org.x, -org.y);

  /* ── Build lookup: target name → parsed position ──────────── */
  const targetMap = {};
  for (const rt of robotData.robtargets) {
    const p = parseRobtarget(rt.value);
    if (p) targetMap[rt.name] = { parsed: p, raw: rt };
  }

  const path = robotData.path || [];
  const pathNames = new Set(path.map(s => s.target));
  for (const s of path) { if (s.via) pathNames.add(s.via); }

  /* Resolve path steps to canvas positions */
  const steps = [];
  for (const s of path) {
    const entry = targetMap[s.target];
    if (!entry) continue;
    const p = entry.parsed;
    if (settings.zFilterEnabled && Math.abs(p.z) > settings.zFilter) continue;
    const step = {
      pos:  toCanvas(p.x, p.y, view),
      zone: s.zone,
      moveType: s.move_type,
      name: s.target,
      parsed: p,
    };
    if (s.via && targetMap[s.via]) {
      const vp = targetMap[s.via].parsed;
      step.via = { pos: toCanvas(vp.x, vp.y, view), name: s.via, parsed: vp };
    }
    steps.push(step);
  }

  /* ── Zone circles (background layer) ────────────────────────── */
  for (const st of steps) {
    if (st.zone <= 0) continue;
    const zrX = st.zone * scaleX;
    const zrY = st.zone * scaleY;
    ctx.save();
    ctx.strokeStyle = 'rgba(160,160,160,0.45)';
    ctx.fillStyle   = 'rgba(200,200,200,0.12)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.ellipse(st.pos.x, st.pos.y, zrX, zrY, 0, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  /* ── Path lines + corner arcs ───────────────────────────────── */
  for (let i = 0; i < steps.length - 1; i++) {
    const A = steps[i], B = steps[i + 1];

    ctx.save();
    ctx.strokeStyle = '#111';
    ctx.lineWidth   = 1.5;
    ctx.lineCap     = 'round';
    if (B.moveType === 'J') ctx.setLineDash([8, 6]);

    if (B.moveType === 'C' && B.via) {
      /* Circular arc from A through CirPoint to B (solid) */
      ctx.beginPath();
      ctx.moveTo(A.pos.x, A.pos.y);
      arcThrough(A.pos.x, A.pos.y, B.via.pos.x, B.via.pos.y, B.pos.x, B.pos.y);
      ctx.stroke();
    } else {
      /* Straight segment with zone clipping */
      const dx = B.pos.x - A.pos.x, dy = B.pos.y - A.pos.y;
      const dist = Math.hypot(dx, dy);
      if (dist >= 1) {
        const ux = dx / dist, uy = dy / dist;
        const zrA = A.zone * scaleAvg;
        const zrB = B.zone * scaleAvg;
        const remaining = dist - zrA - zrB;
        if (remaining > 0) {
          ctx.beginPath();
          ctx.moveTo(A.pos.x + ux * zrA, A.pos.y + uy * zrA);
          ctx.lineTo(B.pos.x - ux * zrB, B.pos.y - uy * zrB);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  /* Corner arcs inside zone circles (only between straight segments) */
  for (let i = 1; i < steps.length - 1; i++) {
    const prev = steps[i - 1], curr = steps[i], next = steps[i + 1];
    if (curr.zone <= 0) continue;
    if (curr.moveType === 'C' || next.moveType === 'C') continue;
    const zr = curr.zone * scaleAvg;

    const dx1 = prev.pos.x - curr.pos.x, dy1 = prev.pos.y - curr.pos.y;
    const len1 = Math.hypot(dx1, dy1);
    const dx2 = next.pos.x - curr.pos.x, dy2 = next.pos.y - curr.pos.y;
    const len2 = Math.hypot(dx2, dy2);
    if (len1 < 1 || len2 < 1) continue;

    const inX  = curr.pos.x + (dx1 / len1) * zr;
    const inY  = curr.pos.y + (dy1 / len1) * zr;
    const outX = curr.pos.x + (dx2 / len2) * zr;
    const outY = curr.pos.y + (dy2 / len2) * zr;

    ctx.save();
    ctx.strokeStyle = '#111';
    ctx.lineWidth   = 1.5;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(inX, inY);
    ctx.quadraticCurveTo(curr.pos.x, curr.pos.y, outX, outY);
    ctx.stroke();
    ctx.restore();
  }

  /* ── Wobj origin ──────────────────────────────────────────────── */
  const wobjName = robotData.wobjdata.length > 0 ? robotData.wobjdata[0].name : '';

  drawArrow(org.x, org.y, org.x + originAxisPxX, org.y,                 '#8B0000', 3.5);
  drawArrow(org.x, org.y, org.x,                 org.y - originAxisPxY, '#006400', 3.5);

  ctx.font      = `bold ${Math.round(fontSize * 1.1)}px monospace`;
  ctx.fillStyle = '#8B0000';
  ctx.fillText('X', org.x + originAxisPxX + 7, org.y + 5);
  ctx.fillStyle = '#006400';
  ctx.fillText('Y', org.x - 5, org.y - originAxisPxY - 7);
  if (wobjName) {
    ctx.fillStyle = '#555';
    ctx.font      = `${fontSize - 1}px monospace`;
    ctx.fillText(wobjName, org.x + 8, org.y + 20);
  }

  /* ── Robtargets (path targets + via/CirPoint targets) ────────── */
  const allDrawPts = [];
  const drawnNames = new Set();
  for (const st of steps) {
    if (!drawnNames.has(st.name)) {
      allDrawPts.push({ pos: st.pos, parsed: st.parsed, name: st.name });
      drawnNames.add(st.name);
    }
    if (st.via && !drawnNames.has(st.via.name)) {
      allDrawPts.push({ pos: st.via.pos, parsed: st.via.parsed, name: st.via.name });
      drawnNames.add(st.via.name);
    }
  }

  for (const pt of allDrawPts) {
    const p   = pt.parsed;
    const pos = pt.pos;

    const axes       = quatAxes2D(p.qw, p.qx, p.qy, p.qz);
    const [xaX, xaY] = axes.xAxis;
    const [yaX, yaY] = axes.yAxis;

    drawArrow(pos.x, pos.y,
      pos.x + xaX * targetAxisPxX, pos.y - xaY * targetAxisPxY,
      '#E82020', 1.8);
    drawArrow(pos.x, pos.y,
      pos.x + yaX * targetAxisPxX, pos.y - yaY * targetAxisPxY,
      '#00AA00', 1.8);

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, dotR, 0, 2 * Math.PI);
    ctx.fillStyle = '#111';
    ctx.fill();

    ctx.font      = `${fontSize}px monospace`;
    ctx.fillStyle = '#111';
    ctx.fillText(pt.name, pos.x + dotR + 4, pos.y - dotR - 3);
  }

  /* ── Calibration marks ──────────────────────────────────────── */
  if (settings.calMarks) {
    const mX = toCanvas(settings.calX, 0, view);
    drawCalMark(mX.x, mX.y, `X = ${settings.calX} mm`, true);
    const mY = toCanvas(0, settings.calY, view);
    drawCalMark(mY.x, mY.y, `Y = ${settings.calY} mm`, false);
  }

  ctx.restore();   /* end of rotated context */

  /* ── Idle hint (outside rotation) ───────────────────────────── */
  if (steps.length === 0 && robotData.robtargets.length === 0) {
    ctx.save();
    ctx.font      = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for robtargets…', W / 2, H / 2 + 60);
    ctx.restore();
  }
}

/* ─── Mouse drag (pan the origin) ─────────────────────────────── */
let drag = null;   /* { startX, startY, startOx, startOy } while dragging */

canvas.addEventListener('mousedown', e => {
  if (!view) return;
  drag = { startX: e.clientX, startY: e.clientY, startOx: view.ox, startOy: view.oy };
  canvas.classList.add('dragging');
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!drag) return;
  view.ox = drag.startOx + (e.clientX - drag.startX);
  view.oy = drag.startOy + (e.clientY - drag.startY);
  draw();
});

window.addEventListener('mouseup', () => {
  drag = null;
  canvas.classList.remove('dragging');
});

/* Touch support */
canvas.addEventListener('touchstart', e => {
  if (!view || e.touches.length !== 1) return;
  const t = e.touches[0];
  drag = { startX: t.clientX, startY: t.clientY, startOx: view.ox, startOy: view.oy };
  e.preventDefault();
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (!drag || e.touches.length !== 1) return;
  const t = e.touches[0];
  view.ox = drag.startOx + (t.clientX - drag.startX);
  view.oy = drag.startOy + (t.clientY - drag.startY);
  draw();
}, { passive: false });

window.addEventListener('touchend', () => { drag = null; });

/* ─── Server-Sent Events ──────────────────────────────────────── */
function connectSSE() {
  const src = new EventSource('/events');
  src.onmessage = e => {
    robotData = JSON.parse(e.data);
    if (!robotData.path) robotData.path = [];
    if (view === null) {
      const pathNames = new Set(robotData.path.map(p => p.target));
      const targets = pathNames.size > 0
        ? robotData.robtargets.filter(r => pathNames.has(r.name))
        : robotData.robtargets;
      initView(targets);
    }
    draw();
  };
  src.onerror = () => console.warn('SSE disconnected – reconnecting…');
}

/* ─── Bootstrap ───────────────────────────────────────────────── */
loadSettings();
resize();       /* sets lastW/lastH, canvas size, and draws once */
connectSSE();   /* initialises view on first data arrival */
</script>
</body>
</html>
