[robot]
# IP address of the ABB IRC5 controller
ip = 169.254.32.199

# RWS port (default is 80 for HTTP)
port = 8800

# Robot Web Services version: 1 for RWS 1.0, 2 for RWS 2.0
rws_version = 1

# RAPID task name (default for single-robot systems)
task = T_ROB1

# Name of the RAPID module to monitor
module = Module1

# How often (in seconds) to poll for new robtarget variables
poll_interval = 2.0

# RWS credentials (default ABB credentials)
username = Default User
password = robotics

# Port for the built-in web visualiser (http://localhost:<web_port>/)
web_port = 5000

# Port for the HTTPS / WebXR server (https://localhost:<https_port>/xr)
https_port = 5443
